<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ee" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Outline&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <title>FoxBox</title>
  </head>
  <body>
    <div id="root"><p style="font-family: sans-serif; text-align: center; margin-top: 30vh; color: #55534e">Chargement de FoxBox…</p></div>
    <script>
      // Après une mise à jour du site, une ancienne page gardée en mémoire peut réclamer des fichiers
      // qui n'existent plus : on recharge alors une seule fois la version à jour.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          try {
            if (!sessionStorage.getItem('foxbox-reloaded')) {
              sessionStorage.setItem('foxbox-reloaded', '1');
              location.reload();
            }
          } catch (_) {}
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
