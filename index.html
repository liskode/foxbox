    <script>
      // Queue du renard qui se trace autour du logo pendant le chargement (même dessin que src/components/Loader.tsx)
      (function () {
        var arc = document.getElementById('boot-arc');
        if (!arc || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
        function pt(d) { return [296 + 134 * Math.cos((d * Math.PI) / 180), 191 + 134 * Math.sin((d * Math.PI) / 180)]; }
        function loop(t) {
          if (!document.getElementById('boot-arc')) return; // l'application a pris le relais
          var k = (t % 2600) / 2600;
          var grow = k < 0.82 ? 0.5 - 0.5 * Math.cos((k / 0.82) * Math.PI) : 1 - (k - 0.82) / 0.18;
          var left = (1 - grow) * 359.9, a = pt(136 - 360 + left), b = pt(136 - 360);
          arc.setAttribute('d', left < 0.5 ? '' : 'M ' + a[0] + ' ' + a[1] + ' A 134 134 0 ' + (left > 180 ? 1 : 0) + ' 0 ' + b[0] + ' ' + b[1]);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>
    <script>
      // Après une mise à jour du site, une ancienne page gardée en mémoire peut réclamer des fichiers
      // qui n'existent plus : on recharge alors une seule fois la version à jour.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          try {
            if (!sessionStorage.getItem('foxbox-reloaded')) {
              sessionStorage.setItem('foxbox-reloaded', '1');
              location.reload();
            }
          } catch (_) {}
        }
      }, true);
    </script>
