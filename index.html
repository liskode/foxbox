    <script>
      // Queue du renard qui se trace autour du logo pendant le chargement (même dessin que src/components/Loader.tsx)
      (function () {
        var spine = document.getElementById('boot-spine');
        if (!spine || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
        function loop(t) {
          if (!document.getElementById('boot-spine')) return; // l'application a pris le relais
          var k = (t % 2600) / 2600;
          spine.setAttribute('stroke-dashoffset', k < 0.82 ? 0.5 + 0.5 * Math.cos((k / 0.82) * Math.PI) : (k - 0.82) / 0.18);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>
    <script>
      // Après une mise à jour du site, une ancienne page gardée en mémoire peut réclamer des fichiers
      // qui n'existent plus : on recharge alors une seule fois la version à jour.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          try {
            if (!sessionStorage.getItem('foxbox-reloaded')) {
              sessionStorage.setItem('foxbox-reloaded', '1');
              location.reload();
            }
          } catch (_) {}
        }
      }, true);
    </script>
